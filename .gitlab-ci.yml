default:
  tags:
    - shared-medium

stages: 
  - build
  - test

rust:check:
  stage: build
  image: harbor.protontech.ch/docker.io/library/rust:alpine
  before_script:
    - apk add --no-cache git
    - rustup component add clippy rustfmt
  script:
    - cargo fmt --check
    - cargo clippy --all-features
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  interruptible: true

test:
  stage: test
  needs: []
  image: harbor.protontech.ch/docker.io/library/rust:alpine
  before_script:
    - apk add --no-cache git
  script:
    - cargo test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  interruptible: true
